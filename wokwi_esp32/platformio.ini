; =================================================================
;  SmartFill - PlatformIO (ESP32)
;  Credenciales ISO 27400: se leen desde credentials.h (NO versionado,
;  ya en .gitignore). Copia credentials_template.h como credentials.h
;  y rellena tus credenciales reales para hardware.
; =================================================================

[env:esp32doit-devkit-v1]
platform = espressif32@6.9.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
; El firmware con Firebase (SSL/TLS) ocupa ~1.6 MB -> no cabe en la particion
; default (1.3 MB). huge_app.csv otorga 3 MB de espacio de aplicacion.
board_build.partitions = huge_app.csv

lib_deps =
    mobizt/Firebase Arduino Client Library for ESP8266 and ESP32@^4.4.17

build_flags =
    -D CORE_DEBUG_LEVEL=0
    -I .
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384
